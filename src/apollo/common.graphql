scalar Object
scalar Timestamp

enum ESort {
  asc
  desc
}

type TQueryBy {
  column: String
  sort: ESort
}

input QueryByInput {
  column: String
  sort: ESort
}

input PaginationInput {
  offset: Int
  limit: Int
  query: [QueryByInput]
}

type TPaymentSocketResponse {
  orderId: String!
  paymentId: String!
  status: EPaymentStatus!
}

type TCursorPageInfo {
  hasMore: Boolean!
  nextCursor: String
}
