type TCategory {
  categoryId: String!
  name: String!
}

input CategoryInput {
  categoryId: String!
  name: String!
}

type Query {
  listCategory: [TCategory!]!
}

type Mutation {
  createCategory(name: String!): TCategory!
  updateCategory(category: CategoryInput!): TCategory!
  deleteCategory(categoryId: String!): Boolean
}
